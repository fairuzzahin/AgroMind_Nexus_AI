services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agromind
      POSTGRES_USER: agromind
      POSTGRES_PASSWORD: change_me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agromind -d agromind"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://agromind:change_me@db:5432/agromind
      FRONTEND_ORIGIN: http://localhost:8000
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
